name: Build Quartz Site
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Quartz
        run: git clone --depth 1 --branch v4.5.2 https://github.com/jackyzha0/quartz.git _quartz-build

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: _quartz-build/node_modules
          key: ${{ runner.os }}-quartz-${{ hashFiles('_quartz-build/package-lock.json') }}

      - name: Install dependencies
        working-directory: _quartz-build
        run: npm ci

      - name: Copy Quartz config
        working-directory: _quartz-build
        run: |
          cp ../.github/quartz/quartz.config.ts .
          cp ../.github/quartz/quartz.layout.ts .

      - name: Copy content
        working-directory: _quartz-build
        run: |
          rm -rf content
          mkdir content
          cp -r ../* content/ 2>/dev/null || true
          rm -rf content/_quartz-build
          rm -rf .git

      - name: Build
        working-directory: _quartz-build
        run: npx quartz build -o $GITHUB_WORKSPACE/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
